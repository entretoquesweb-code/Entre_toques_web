name: Docker

# Valida a imagem só quando algo que a afeta muda (economiza minutos de CI).
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts

permissions:
  contents: read

jobs:
  build:
    name: Build e smoke test da imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --build-arg SITE_URL=https://www.entretoques.com.br -t entre-toques:ci .

      - name: Smoke test (contêiner somente leitura, sem capabilities)
        run: |
          docker run -d --name app -p 3000:3000 --read-only \
            --tmpfs /app/.next/cache:uid=1001,gid=1001 --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges entre-toques:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'
          test "$(docker exec app id -u)" = "1001"
